[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "conv-coach"
version = "0.1.0"
description = "ConvCoach — AI-powered conversational coaching application"
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11"
streamlit = ">=1.32"
google-genai = ">=0.8"
python-dotenv = ">=1.0"
pandas = ">=2.0"
pyyaml = ">=6.0"
tabulate = ">=0.9"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
ruff = ">=0.3"
ipykernel = "^7.3.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
